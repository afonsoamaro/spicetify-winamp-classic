name: Bug report
description: Something renders wrong, or the theme stopped working
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A screenshot and your Spotify version are usually enough to find the problem.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you saw, and what you expected instead.
      placeholder: The track list header lost its bevel and shows Spotify's own font.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The screen or element, as you would describe it out loud.
      placeholder: Playlist page, the row of buttons above the tracks
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image in here. For a theme bug this is worth more than any description.
  - type: input
    id: spotify
    attributes:
      label: Spotify version
      description: Spotify menu, then About Spotify.
      placeholder: 1.3.0.277
    validations:
      required: true
  - type: input
    id: spicetify
    attributes:
      label: Spicetify version
      description: Output of `spicetify -v`.
      placeholder: 2.45.1
  - type: dropdown
    id: install
    attributes:
      label: How did you install the theme?
      options:
        - Spicetify Marketplace
        - Manually (clone or download)
        - Not sure
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Arch
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: |
        Only if the theme broke outright rather than looking wrong. Run `spicetify enable-devtools`, press Ctrl+Shift+I (Cmd+Option+I on macOS), open the Console tab and paste anything red.
      render: text
